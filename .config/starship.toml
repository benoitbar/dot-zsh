"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](fg:red bg:peach)\
$directory\
$package\
[](fg:peach bg:yellow)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
[](fg:yellow bg:green)\
$nodejs\
${custom.npm}\
${custom.pnpm}\
${custom.yarn}\
$perl\
$python\
$ruby\
[](fg:green bg:teal)\
$custom\
[](fg:teal bg:sapphire)\
$docker_context\
$nix_shell\
[](fg:sapphire bg:lavender)\
$all\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[custom.nomad_env]
symbol = ""
when = "test -f .env && grep -q '^NOMAD_ENV=' .env"
command = "source .env && echo $NOMAD_ENV"
format = '[[ $symbol $output ](fg:crust bg:teal)]($style)'
style = "bg:teal"

[custom.npm]
disabled = true
symbol = ""
when = "grep -q '\"name\": \"npm\"' package.json"
command = "npm -v"
format = '[[ $symbol $output ](fg:crust bg:green)]($style)'
style = "bg:green"

[custom.pnpm]
symbol = ""
when = "test -f package.json && grep -q '\"name\": \"pnpm\"' package.json"
command = "pnpm -v"
format = '[[ $symbol $output ](fg:crust bg:green)]($style)'
style = "bg:green"

[custom.yarn]
symbol = ""
when = "test -f package.json && grep -q '\"name\": \"yarn\"' package.json"
command = "yarn -v"
format = '[[ $symbol $output ](fg:crust bg:green)]($style)'
style = "bg:green"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Téléchargements" = " "
"Musique" = "󰝚 "
"Images" = " "
"workspace" = "󰲋 "

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch(:$remote_branch) ](fg:crust bg:yellow)]($style)'

[git_commit]
style = "bg:yellow"
format = "[[\\($hash$tag\\) ](fg:crust bg:yellow)]($style)"

[git_state]
style = "bg:yellow"
format = "[[\\($state( $progress_current/$progress_total)\\) ](fg:crust bg:yellow)]($style)"

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind) ](bold fg:#d20f39 bg:yellow)]($style)'
diverged = '⇣⇡'
modified = '*'
conflicted = '!'

[nix_shell]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $name) ](fg:crust bg:sapphire)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Ubuntu = "󰕈 "
Raspbian = "󰐿 "
Manjaro = " "
Linux = "󰌽 "
Alpine = " "
Android = " "
Arch = "󰣇 "
Debian = "󰣚 "

[package]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'
display_private = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[perl]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[ruby]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[username]
show_always = false
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user]($style)'
